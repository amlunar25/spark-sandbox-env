services:

  # ─── Spark Cluster ────────────────────────────────────────────────────────────

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
      target: cluster
    container_name: spark-master
    hostname: spark-master
    networks:
      - sandbox
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "18081:8080"  # Spark Master Web UI (host 18081; 8080 is often taken)
      - "7077:7077"   # Spark submit endpoint
    volumes:
      - ./data:/home/jupyter/data
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: cluster
    container_name: spark-worker
    hostname: spark-worker
    networks:
      - sandbox
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - 3g
      - --cores
      - "2"
      - spark://spark-master:7077
    environment:
      PYSPARK_PYTHON: python3
    depends_on:
      - spark-master
    volumes:
      - ./data:/home/jupyter/data
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-history:
    build:
      context: .
      dockerfile: Dockerfile
      target: cluster
    container_name: spark-history
    hostname: spark-history
    networks:
      - sandbox
    # The History Server refuses to start if the event log dir is missing.
    # The notebook (uid 1000) and this container (uid 185) both write there, so make it world-writable.
    command:
      - sh
      - -c
      - >-
        mkdir -p /home/jupyter/data/spark-events &&
        chmod 1777 /home/jupyter/data/spark-events &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    ports:
      - "18080:18080"   # Spark History Server (finished apps, from event logs)
    volumes:
      - ./data:/home/jupyter/data
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  # ─── Jupyter Notebook (PySpark + DuckDB) ─────────────────────────────────────

  notebook:
    build:
      context: .
      dockerfile: Dockerfile
      target: notebook
    container_name: notebook
    hostname: notebook
    networks:
      - sandbox
    ports:
      - "8888:8888"   # JupyterLab UI
      - "4040:4040"   # Spark App UI (active during a job)
    environment:
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sandbox
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark123
      JUPYTER_TOKEN: spark123
    volumes:
      - ./notebooks:/home/jupyter/notebooks
      - ./data:/home/jupyter/data
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      - spark-master
      - spark-history
      - kafka
      - postgres

  # ─── Kafka (KRaft — no Zookeeper) ────────────────────────────────────────────

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka
    networks:
      - sandbox
    ports:
      - "9092:9092"   # Host access for local producers/consumers
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    networks:
      - sandbox
    ports:
      - "8090:8080"   # Kafka UI
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    networks:
      - sandbox
    ports:
      - "5433:5432"   # host 5433; 5432 is often taken by a local Postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark123
      POSTGRES_DB: sandbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d sandbox"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sandbox:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
