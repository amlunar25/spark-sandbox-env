# ─── Driver / Executor memory ─────────────────────────────────────────────────
# Worker is started with --memory 3g (docker-compose.yml). An executor needs
# spark.executor.memory + memoryOverhead (max(384m, 10%)) to fit, so 2g + 384m
# leaves room on that worker. Lower these to force spill / GC in the lab.
spark.driver.memory                     2g
spark.executor.memory                   2g

# ─── Delta Lake 4.x (spark_catalog) ──────────────────────────────────────────
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog         org.apache.spark.sql.delta.catalog.DeltaCatalog

# ─── Apache Iceberg 1.10 (catalog "iceberg", Hadoop catalog on the data volume)
spark.sql.catalog.iceberg               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type          hadoop
spark.sql.catalog.iceberg.warehouse     file:///home/jupyter/data/iceberg

# ─── Adaptive Query Execution ─────────────────────────────────────────────────
spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled     true

# ─── JVM stack size (prevents StackOverflowError in Spark 4.x / Java 17) ─────
spark.driver.extraJavaOptions           -Xss64m
spark.executor.extraJavaOptions         -Xss64m

# ─── Event log → Spark History Server (http://localhost:18080) ───────────────
# Lets you open a finished job's UI after the notebook session has ended.
spark.eventLog.enabled                  true
spark.eventLog.dir                      file:///home/jupyter/data/spark-events
spark.history.fs.logDirectory           file:///home/jupyter/data/spark-events

# ─── Misc ─────────────────────────────────────────────────────────────────────
spark.ui.showConsoleProgress            false
